name: Open Collective Sponsorship Test
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-september-2026-sponsorships
  cancel-in-progress: false

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test authentication (read only)
        env:
          OPENCOLLECTIVE_TOKEN: ${{ secrets.OPENCOLLECTIVE_TOKEN }}
        run: python3 scripts/test-opencollective-api.py


name: Manual Contribution Overview

on:
  workflow_dispatch:
    inputs:
      date:
        description: Date to simulate workflow run (YYYY-MM-DD)
        required: true
        type: string

jobs:
  generate-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate historical report without posting PR comments
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.TSCIRCUIT_BOT_OPENAI_KEY }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          sed -i '/await postMergeComment(analysis)/d' index.ts
          bun scripts/generate-overview-for-date.ts "$INPUT_DATE"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-contribution-overview
          path: |
            contribution-overviews/2026-10-06.json
            contribution-overviews/2026-10-06.md
            pr-analysis/2026-10-06.json
